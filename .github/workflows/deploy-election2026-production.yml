name: Deploy approved Election Hub production release

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: election2026-production
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:production
      - run: npm run build:worker:production
      - uses: actions/upload-artifact@v4
        with:
          name: worker-assets
          path: worker-assets/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: worker-assets
          path: worker-assets/
      - name: Check deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Release production Worker without changing routes
        run: |
          RELEASE_TAG="prod-${GITHUB_SHA:0:12}"
          npx --no-install wrangler versions upload --config wrangler.jsonc --tag "$RELEASE_TAG"
          npx --no-install wrangler versions deploy --config wrangler.jsonc --version-tag "$RELEASE_TAG" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1bad46d553cafed5f25a324dbc854d7
      - name: Verify production deployment
        run: node scripts/verify-deployment.mjs https://tfc-taiwan.org.tw production
